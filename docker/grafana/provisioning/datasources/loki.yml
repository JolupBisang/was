apiVersion: 1

datasources:
  - name: Loki
    uid: silrok-logs
    type: loki
    access: proxy
    url: http://my-loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: silrok-prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
