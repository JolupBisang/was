services:
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: my-logstash
    platform: linux/amd64
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "${LOGSTASH_PORT_2:-9600}:9600"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    networks:
      - log_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.1
    container_name: my-kibana
    platform: linux/amd64
    ports:
      - "${KIBANA_PORT:-5601}:560 1"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:${ES_PORT:-9200}"
    restart: unless-stopped
    networks:
      - log_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: my-es
    platform: linux/amd64
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    restart: unless-stopped
    networks:
      - log_net

networks:
  log_net:
    external: true
    name: ${DOCKER_NETWORK_NAME:-combined_network}
