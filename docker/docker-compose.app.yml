services:
  blue:
    image: "${DOCKER_REGISTRY_URL}/${SPRING_IMAGE_NAME}:${DOCKER_IMAGE_TAG:-latest}"
    container_name: blue
    environment:
      - PROFILES=${SPRING_PROFILE:-local}
      - ENV=${SPRING_ENV:-blue}
      - TZ=Asia/Seoul
    env_file:
      - "${ENV_FILE:-.env.dev}"
    ports:
      - "${BLUE_PORT:-8080}:8080"
    volumes:
      - ${BLUE_LOG_PATH:-./docker_logs/spring/blue}:/opt/app/logs
    networks:
      - app_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  green:
    image: "${DOCKER_REGISTRY_URL}/${SPRING_IMAGE_NAME}:${DOCKER_IMAGE_TAG:-latest}"
    container_name: green
    environment:
      - PROFILES=${SPRING_PROFILE:-local}
      - ENV=${SPRING_ENV:-green}
      - TZ=Asia/Seoul
    env_file:
      - "${ENV_FILE:-.env.dev}"
    ports:
      - "${GREEN_PORT:-8081}:8080"
    volumes:
      - ${GREEN_LOG_PATH:-./docker_logs/spring/green}:/opt/app/logs
    networks:
      - app_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  alloy:
    image: grafana/alloy:latest
    container_name: my-alloy
    environment:
      - TZ=Asia/Seoul
      - LOKI_HOST=${LOKI_HOST}
      - PROMETHEUS_HOST=${PROMETHEUS_HOST}
      - DATA_HOST=${DATA_HOST}
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - alloy_positions:/alloy
      - ${BLUE_LOG_PATH:-./docker_logs/spring/blue}:/var/log/docker/spring/blue:ro
      - ${GREEN_LOG_PATH:-./docker_logs/spring/green}:/var/log/docker/spring/green:ro
    command:
      - run
      - /etc/alloy/config.alloy
    networks:
      - app_network
    restart: unless-stopped

volumes:
  alloy_positions:

networks:
  app_network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-combined_network}
